name: Build LX Pen

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  GCC_BASE_URL: https://github.com/Redbeanw44602/aarch64-linux-gnu-gcc-6.5.0/releases/download/6.5.0

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git wget zip python nodejs

      - name: 安装 aarch64 工具链（glibc 2.27，与词典笔一致）
        run: |
          wget -q "${{ env.GCC_BASE_URL }}/aarch64-linux-gnu-binutils-2.30-1-x86_64.pkg.tar.zst"
          wget -q "${{ env.GCC_BASE_URL }}/aarch64-linux-gnu-glibc-2.27-1-any.pkg.tar.zst"
          wget -q "${{ env.GCC_BASE_URL }}/aarch64-linux-gnu-gcc-6.5.0-1-x86_64.pkg.tar.zst"
          pacman -U --noconfirm \
            aarch64-linux-gnu-binutils-2.30-1-x86_64.pkg.tar.zst \
            aarch64-linux-gnu-glibc-2.27-1-any.pkg.tar.zst \
            aarch64-linux-gnu-gcc-6.5.0-1-x86_64.pkg.tar.zst
          aarch64-linux-gnu-gcc --version

      - name: 构建数据层并同步
        run: |
          cd lx-music-port && node tools/build.js && cd ..
          node scripts/sync-lx-sdk.js

      - name: 交叉编译 runner（aarch64）
        run: |
          chmod +x runner/build.sh
          runner/build.sh

      - name: 打包插件
        run: |
          python scripts/package.py
          mkdir -p dist
          cp lx-pen.zip dist/
          ls -la dist/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: PenMods-LX-Pen
          path: dist/
          retention-days: 14

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: dist/*.zip
          generate_release_notes: true
